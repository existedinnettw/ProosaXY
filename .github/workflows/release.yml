name: release

# Tag `vX.Y.Z` (matching [project].version) to publish the model (an fcppm package: the
# documents in src/ and doc/) to the org's Gitea PyPI index and attach the files to a
# GitHub release. Gated by the same checks as CI.
#
# Repository secrets (pushed by the git-acc-rtn repo's secret-sync workflow):
#   GITEA_PYPI_USERNAME / GITEA_PYPI_PASSWORD - account allowed to read/write PyPI packages in the org
#   GITEA_PYPI_URL                            - publish endpoint,
#                                               e.g. https://gitea.example.org/api/packages/<org>/pypi
#
# A file the index already lists is not uploaded again, so re-running a release after a partial
# failure is safe; if the rebuilt file differs from the published one, the release ships the
# published copy. Gitea itself refuses to overwrite a version.

on:
  push:
    tags: ["v*"]

permissions: {}

# One release run per tag at a time, so two reruns never upload the same file concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
    env:
      UV_INDEX: inkr=https://gitea.insleker.org/api/packages/inkr_org/pypi/simple/
      UV_INDEX_INKR_USERNAME: ${{ secrets.GITEA_PYPI_USERNAME }}
      UV_INDEX_INKR_PASSWORD: ${{ secrets.GITEA_PYPI_PASSWORD }}
      PUBLISH_URL: ${{ secrets.GITEA_PYPI_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false # no cache in the job that publishes

      - name: Tag must match the package version
        run: |
          version=$(uv version --short)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} != v${version} in pyproject.toml"; exit 1; }

      - run: uv lock --check
      # fcppm as locked in uv.lock, for lint and as the build backend
      - run: uv export --only-group dev --no-hashes --no-emit-project --no-header -o "$RUNNER_TEMP/build-constraints.txt"
      # the locked fcppm, without building the project (`uv run` would build it with an
      # unconstrained backend)
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync fcppm lint
      - run: uv build --build-constraints "$RUNNER_TEMP/build-constraints.txt"
      - name: The assemblies are in the wheel
        run: python3 .github/workflows/wheel_content.py dist/*.whl

      - name: Publish to the Gitea PyPI index
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.GITEA_PYPI_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.GITEA_PYPI_PASSWORD }}
        run: |
          for f in dist/*.tar.gz dist/*.whl; do
            file=$(basename "$f")
            name=$(echo "${file%%-[0-9]*}" | tr '_' '-')
            # the index's link to this file, if any: .../<file>#sha256=<hash>
            link=$(curl -fsS --max-time 120 -u "$UV_PUBLISH_USERNAME:$UV_PUBLISH_PASSWORD" \
                "$PUBLISH_URL/simple/$name/" 2>/dev/null | grep -o "href=\"[^\"]*/$file#sha256=[0-9a-f]*" | head -n 1 || true)
            if [ -z "$link" ]; then
              uv publish --publish-url "$PUBLISH_URL" "$f"
            elif [ "${link##*sha256=}" = "$(sha256sum "$f" | cut -d' ' -f1)" ]; then
              echo "skip $file: already in the index"
            else
              # a rerun rebuilt different bytes; the index keeps its copy, so the release ships that one
              echo "replace $file with the copy already in the index"
              url=${link#href=\"}
              curl -fsSL --max-time 600 -u "$UV_PUBLISH_USERNAME:$UV_PUBLISH_PASSWORD" -o "$f" "${url%%#*}"
              test "${link##*sha256=}" = "$(sha256sum "$f" | cut -d' ' -f1)"
            fi
          done

      - name: GitHub release with the distributions
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
