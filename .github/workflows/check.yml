name: check

# On every push and pull request: the lock matches pyproject.toml, `fcppm lint` finds no error
# (every App::Link in the shipped documents stays inside the package), and the wheel builds
# with the assemblies in it. The packages come from the org's Gitea index, read with the
# GITEA_PYPI_* secrets pushed by git-acc-rtn.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pull requests from forks and Dependabot get no Actions secrets, so they cannot read the
    # index: skip rather than fail.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      UV_INDEX: inkr=https://gitea.insleker.org/api/packages/inkr_org/pypi/simple/
      UV_INDEX_INKR_USERNAME: ${{ secrets.GITEA_PYPI_USERNAME }}
      UV_INDEX_INKR_PASSWORD: ${{ secrets.GITEA_PYPI_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv lock --check
      # fcppm as locked in uv.lock, for lint and as the build backend
      - run: uv export --only-group dev --no-hashes --no-emit-project --no-header -o "$RUNNER_TEMP/build-constraints.txt"
      # the locked fcppm, without building the project (`uv run` would build it with an
      # unconstrained backend)
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync fcppm lint
      - run: uv build --build-constraints "$RUNNER_TEMP/build-constraints.txt"
      - name: The assemblies are in the wheel
        run: python3 .github/workflows/wheel_content.py dist/*.whl
